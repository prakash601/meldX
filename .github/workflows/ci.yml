name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meldx
          POSTGRES_PASSWORD: meldx
          POSTGRES_DB: meldx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
      DATABASE_URL_TEST: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      # The backup/restore exercise drives real pg client tools; pin them to
      # the service's major version — a newer pg_dump emits GUCs (e.g.
      # transaction_timeout) that a 16 server rejects on restore.
      - name: Match postgres client tools to the service version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy meldx
      - run: uv run pytest -q
      - run: |
          (uv run uvicorn meldx.app.main:app --port 8001 > /tmp/uvicorn.log 2>&1 &)
          sleep 4
          curl -sf http://localhost:8001/health
      - name: Docker and installed CLI smoke check
        env:
          API: http://localhost:8002
          OWNER_BOOTSTRAP_SECRET: ci-smoke-secret
        run: |
          docker build -t meldx:ci .
          docker run --detach --name meldx-smoke --network host \
            -e DATABASE_URL -e PORT=8002 -e RENDER_EXTERNAL_HOSTNAME=meldx.onrender.com \
            -e ENABLE_AUTH=true -e OWNER_BOOTSTRAP_SECRET \
            -e ENABLE_MCP=false -e ENABLE_AGENT_EXECUTION=false \
            meldx:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$API/health"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs meldx-smoke; exit 1; fi
          # v0.0.4 protected smoke: unauthorized access fails...
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/tasks")
          if [ "$code" != "401" ]; then echo "unauthorized list returned $code"; docker logs meldx-smoke; exit 1; fi
          # ...the owner can log in through the form and use the board...
          curl -fsS -c /tmp/smoke-cookies -X POST -d "secret=$OWNER_BOOTSTRAP_SECRET" -o /dev/null "$API/login"
          curl -fsS -b /tmp/smoke-cookies "$API/" | grep -q "Today"
          # ...and the CLI mints a token, works, and signs out.
          echo "$OWNER_BOOTSTRAP_SECRET" | uv run meldx login --name ci-smoke
          uv run meldx add "CI CLI smoke" --due today --priority high
          uv run meldx list --today --json
          uv run meldx logout
          code=$(curl -s -o /dev/null -w '%{http_code}' "$API/api/tasks")
          if [ "$code" != "401" ]; then echo "token still valid after logout ($code)"; docker logs meldx-smoke; exit 1; fi
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker inspect meldx-smoke >/dev/null 2>&1; then
            docker logs meldx-smoke
            docker rm -f meldx-smoke
          fi
