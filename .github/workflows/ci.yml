name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meldx
          POSTGRES_PASSWORD: meldx
          POSTGRES_DB: meldx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
      DATABASE_URL_TEST: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy meldx
      - run: uv run pytest -q
      - run: |
          (uv run uvicorn meldx.app.main:app --port 8001 > /tmp/uvicorn.log 2>&1 &)
          sleep 4
          curl -sf http://localhost:8001/health
      - name: Docker and installed CLI smoke check
        env:
          API: http://localhost:8002
        run: |
          docker build -t meldx:ci .
          docker run --detach --name meldx-smoke --network host \
            -e DATABASE_URL -e PORT=8002 -e RENDER_EXTERNAL_HOSTNAME=meldx.onrender.com meldx:ci
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$API/health"; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then docker logs meldx-smoke; exit 1; fi
          uv run meldx add "CI CLI smoke" --due today --priority high
          uv run meldx list --today --json
      - name: Container logs and cleanup
        if: always()
        run: |
          if docker inspect meldx-smoke >/dev/null 2>&1; then
            docker logs meldx-smoke
            docker rm -f meldx-smoke
          fi
