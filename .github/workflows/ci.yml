name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meldx
          POSTGRES_PASSWORD: meldx
          POSTGRES_DB: meldx
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
      DATABASE_URL_TEST: postgresql+asyncpg://meldx:meldx@localhost:5432/meldx
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run alembic upgrade head
      - run: uv run ruff check .
      - run: uv run mypy meldx
      - run: uv run pytest -q
      - run: |
          (uv run uvicorn meldx.app.main:app --port 8001 > /tmp/uvicorn.log 2>&1 &)
          sleep 4
          curl -sf http://localhost:8001/health
