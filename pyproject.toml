[project]
name = "meldx"
version = "0.1.0"
description = "meldX — personal todo that agents can claim and complete"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "mcp[cli]>=1.0",
  "sqlmodel>=0.0.22",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "sse-starlette>=2.1",
  "jinja2>=3.1",
  "python-multipart>=0.0.18",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
  "dateparser>=1.2",
  "structlog>=24.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
